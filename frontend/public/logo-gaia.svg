<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="gaiaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#059669" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Tech Ring -->
  <circle cx="50" cy="50" r="44" fill="none" stroke="#10b981" stroke-width="1.5" stroke-dasharray="8 6" opacity="0.6"/>
  
  <!-- Central Leaf & AI Nodes Shape -->
  <path d="M 50 14 C 74 24 82 52 66 76 C 54 94 36 86 28 72 C 16 52 28 26 50 14 Z" fill="url(#gaiaGrad)"/>
  
  <!-- Tech Circuit Spine -->
  <path d="M 50 20 L 50 78 M 50 36 L 66 28 M 50 48 L 32 42 M 50 60 L 64 56 M 50 68 L 36 66" fill="none" stroke="#d1fae5" stroke-width="2.2" stroke-linecap="round"/>
  
  <!-- AI Neural Nodes -->
  <circle cx="66" cy="28" r="3.5" fill="#34d399" filter="url(#glow)"/>
  <circle cx="32" cy="42" r="3.5" fill="#34d399" filter="url(#glow)"/>
  <circle cx="64" cy="56" r="3.5" fill="#34d399" filter="url(#glow)"/>
  <circle cx="36" cy="66" r="3" fill="#a7f3d0"/>
  <circle cx="50" cy="20" r="4" fill="#ffffff" filter="url(#glow)"/>
  <circle cx="50" cy="78" r="4" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
</svg>
